version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "11112:11112/tcp"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - DICOM_AE_TITLE=UTERUS_GLB
      - DICOM_PORT=11112
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
